name: Release Drafter

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Update draft release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
