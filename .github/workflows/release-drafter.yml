name: Release Drafter

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Update draft release
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
