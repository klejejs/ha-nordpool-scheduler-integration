name: Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the manifest version from the release tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          manifest=custom_components/nordpool_scheduler/manifest.json
          jq --arg version "${VERSION#v}" '.version = $version' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: Zip the integration
        working-directory: custom_components/nordpool_scheduler
        run: zip -r "$GITHUB_WORKSPACE/nordpool_scheduler.zip" . -x '__pycache__/*'

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: nordpool_scheduler.zip
